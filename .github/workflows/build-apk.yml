name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Preparar la app web
        run: |
          mkdir -p www
          cp index.html www/index.html
          ls -la www
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Permisos de camara y microfono
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />' $M
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />' $M
          sed -i '/<application/i \    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' $M
          sed -i '/<application/i \    <uses-feature android:name="android.hardware.camera" android:required="false" />' $M
          cat $M
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: football-live-broadcast-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
