:root{--bg:#0b0d14;--pn:#141826;--ln:#262c42;--tx:#e8ecf8;--mu:#8b93b0;--ac:#1e9bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,sans-serif}
body{min-height:100vh}
.F{font-family:'TNT Sans','Barlow Condensed','Arial Narrow',sans-serif}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}
header b{font:700 20px 'TNT Sans','Barlow Condensed',sans-serif;letter-spacing:.08em}header b i{color:var(--ac);font-style:normal}
.live{width:10px;height:10px;border-radius:50%;background:#555}.live.on{background:#f33;animation:p 1s infinite}@keyframes p{50%{opacity:.3}}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:10px;padding:10px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.stage{position:relative;aspect-ratio:16/9;container-type:inline-size;background:#000 linear-gradient(135deg,#10331f,#0a1a12);overflow:hidden;border-radius:8px;width:100%}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:width .6s,height .6s}.stage.md video{right:auto;bottom:auto;width:77.3%;height:80.5%}.fd{animation:fade .6s both}.nr .fd{animation:none}
.gl{background:rgba(255,255,255,.16);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 30px rgba(0,0,0,.35);color:#fff}
body:not(.out) header{display:none}body:not(.out) main{position:fixed;inset:0;display:block;padding:0;background:#000;overflow:hidden}body:not(.out) main>div:first-child{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}body:not(.out) .stage{width:min(100vw,calc(100dvh*16/9));border-radius:0}
body.out #hud{display:none}#hud{position:fixed;inset:0;pointer-events:none;z-index:20;--u:min(11vmin,62px)}#hud button{pointer-events:auto;font-size:calc(var(--u)*.4);border-radius:50%;width:var(--u);height:var(--u);min-height:0;padding:0;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.hud-top{position:absolute;top:max(env(safe-area-inset-top),10px);left:14px;right:14px;display:flex;gap:8px;align-items:center;justify-content:flex-end}.chip{pointer-events:auto;padding:7px 14px;border-radius:99px;font-size:13px;font-weight:700;margin-right:auto}
.pill{position:absolute;bottom:max(env(safe-area-inset-bottom),14px);display:flex;align-items:center;gap:8px;padding:8px;border-radius:99px}.hud-l{left:max(env(safe-area-inset-left),14px)}.hud-r{right:max(env(safe-area-inset-right),14px)}.pill b{padding:0 10px;font:700 calc(var(--u)*.38) 'TNT Sans',sans-serif;white-space:nowrap}
.hud-c{position:absolute;bottom:max(env(safe-area-inset-bottom),14px);left:50%;transform:translateX(-50%);display:flex;gap:12px;margin-bottom:10px}
#hud .recb{position:absolute;right:max(env(safe-area-inset-right),22px);top:50%;transform:translateY(-50%);width:calc(var(--u)*1.6);height:calc(var(--u)*1.6);border-radius:50%}.recb i{width:68%;height:68%;border-radius:50%;background:#e3262f;transition:all .25s}.recb.on i{width:36%;height:36%;border-radius:6px}
@media (orientation:portrait){.hud-c{bottom:calc(var(--u)*2.4)}#hud .recb{top:auto;bottom:calc(var(--u)*1.4);right:50%;transform:translateX(50%)}.hud-l,.hud-r{bottom:max(env(safe-area-inset-bottom),10px);transform:scale(.8)}.hud-l{transform-origin:left bottom}.hud-r{transform-origin:right bottom}}
body:not(.out) #sheet{position:fixed;right:0;top:0;bottom:0;width:min(540px,94vw);z-index:60;overflow:auto;padding:12px;margin:0;transform:translateX(110%);transition:transform .4s cubic-bezier(.2,.9,.2,1);background:rgba(24,28,46,.55);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);border-left:1px solid rgba(255,255,255,.2);border-radius:28px 0 0 28px}body.sheet-open #sheet{transform:none}
@media (orientation:portrait){body:not(.out) #sheet{top:auto;left:0;width:100%;height:74dvh;border-radius:28px 28px 0 0;border-left:0;border-top:1px solid rgba(255,255,255,.2);transform:translateY(110%)}body.sheet-open #sheet{transform:none}}
#sheet .pan{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);border-radius:16px}#sheet button:not(.a):not(.r):not(.g),#sheet select,#sheet input,#sheet textarea{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);border-radius:12px}
.sh-top{display:flex;gap:8px;align-items:center;position:sticky;top:-12px;z-index:2;padding:6px 0;margin-bottom:6px}#tabs{flex-wrap:nowrap;overflow-x:auto;margin:0!important;flex:1}#tabs button{flex:0 0 auto;border-radius:99px}
#adv{position:fixed;z-index:80;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:92dvh;overflow:auto;padding:18px;border-radius:28px;display:none;background:rgba(30,32,40,.7)}#adv .seg{display:flex;gap:4px;background:rgba(255,255,255,.1);padding:4px;border-radius:16px;margin:6px 0 12px}#adv .seg button{flex:1;border-radius:12px;background:transparent;border:0}#adv .seg button.on{background:rgba(255,255,255,.28)}#adv .cl{width:40px;height:40px;border-radius:50%;padding:0}
.L{position:absolute;inset:0;pointer-events:none}
.in{animation:in .6s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(-3cqw)}}
.pan{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px;margin-bottom:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
button,select,input,textarea{font:inherit;color:var(--tx);background:#1b2135;border:1px solid var(--ln);border-radius:6px;padding:8px 10px}
button{cursor:pointer;min-height:40px}button:active{transform:scale(.97)}
button.a,.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
button.r{background:#a21d2c}button.g{background:#1d7a3e}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.row{display:flex;gap:6px;margin:4px 0;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:70px}
label{color:var(--mu);font-size:12px;display:block}h4{margin:6px 0;font:700 14px 'TNT Sans','Barlow Condensed';letter-spacing:.1em;color:var(--ac)}
textarea{width:100%;min-height:60px}
.tp{display:flex;gap:6px;overflow:auto}.tp div{min-width:110px;border:2px solid var(--ln);border-radius:6px;padding:4px;font-size:11px;text-align:center;cursor:pointer}.tp div.on{border-color:var(--ac)}.tp img{width:100%;height:46px;object-fit:contain;background:#222}
body.out header,body.out .side{display:none}body.out main{display:block;padding:0}body.out .stage{border-radius:0;height:100vh;aspect-ratio:auto}
body.out .stage{width:100vw}
.thumb{width:28px;height:28px;object-fit:cover;border-radius:4px;background:#222}
/* graphics */
.sb{position:absolute;left:3cqw;top:3cqw;width:44cqw}.sb img{width:100%;display:block}.sb>*:not(img){position:absolute;color:#fff;text-align:center;font-family:'TNT Sans','Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;white-space:nowrap}
.gx{position:absolute;left:10cqw;width:80cqw;top:50%;transform:translateY(-50%)}.gx>img{width:100%;display:block}
.gx .z{position:absolute;color:#fff;text-align:center;font-family:'TNT Sans','Barlow Condensed','Arial Narrow',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.gx .z img{max-width:100%;object-fit:contain}
.lt{position:absolute;left:6cqw;bottom:6cqw;display:flex;align-items:stretch;font-family:'TNT Sans','Barlow Condensed','Arial Narrow',sans-serif;color:#fff;box-shadow:0 .6cqw 2cqw #0008}
.lt .ic{padding:1cqw 1.8cqw;font-size:3.4cqw;display:flex;align-items:center}.lt .tt{background:#0d0227;padding:.8cqw 2.5cqw;min-width:30cqw}.lt .tt b{font-size:3.2cqw;display:block;text-transform:uppercase}.lt .tt span{font-size:1.8cqw;color:#9cc8ff}
.ln{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);aspect-ratio:2400/1080;container-type:inline-size}.ln>img{width:100%;height:100%;display:block}

let stream,facing='environment',rec,chunks=[];
async function cam(){try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw {name:'NoAPI'};if(stream)stream.getTracks().forEach(t=>t.stop());const [w,h]=($('res')?$('res').value:'1280x720').split('x').map(Number);const tr=[{video:{facingMode:facing,width:{ideal:w},height:{ideal:h}},audio:true},{video:{facingMode:facing},audio:true},{video:true,audio:true},{video:true,audio:false}];let er;stream=null;for(const c of tr){try{stream=await navigator.mediaDevices.getUserMedia(c);break}catch(e){er=e}}if(!stream)throw er;$('vid').srcObject=stream;await $('vid').play().catch(()=>{});$('st').textContent='Cámara activa';const c0=$('cerr');if(c0)c0.textContent=''}catch(e){const M={NoAPI:'Este navegador o contexto no permite usar la cámara. Abre la app en Chrome (https) o instala el APK con permiso de cámara.',NotAllowedError:'Permiso de cámara denegado. Permítelo en el candado o ajustes del navegador.'+(window.self!==window.top?' Estás dentro de claude.ai: toca "Abrir en pestaña completa" en la pestaña Cámara.':''),NotFoundError:'No se encontró ninguna cámara.',NotReadableError:'La cámara la está usando otra app. Ciérrala e intenta de nuevo.',SecurityError:'Bloqueado por seguridad: abre la app en pestaña completa.'},msg=M[e.name]||('No se pudo abrir la cámara: '+(e.message||e.name));$('st').textContent='Cámara no disponible';const c1=$('cerr');if(c1)c1.textContent=msg;alert(msg)}}
function srcFile(cap){const i=document.createElement('input');i.type='file';i.accept='video/*';if(cap)i.setAttribute('capture','environment');i.onchange=()=>{const f=i.files[0];if(!f)return;const v=$('vid');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}v.srcObject=null;v.src=URL.createObjectURL(f);v.loop=true;v.muted=true;v.play().catch(()=>{});$('st').textContent='Video cargado'};i.click()}
async function scr(){try{stream=await navigator.mediaDevices.getDisplayMedia({video:true});$('vid').srcObject=stream;$('st').textContent='Pantalla compartida'}catch(e){alert('No disponible aquí: '+(e.name||e.message))}}
async function diag(){const L=[];L.push('Contexto seguro (https): '+window.isSecureContext);L.push('Dentro de otra página (iframe): '+(window.self!==window.top));L.push('Dirección: '+location.protocol+'//'+location.hostname);L.push('API de cámara: '+!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia));try{const pp=document.permissionsPolicy||document.featurePolicy;L.push('Política de cámara permitida: '+(pp?pp.allowsFeature('camera'):'n/d'))}catch(e){L.push('Política: n/d')}try{const p=await navigator.permissions.query({name:'camera'});L.push('Permiso de cámara: '+p.state)}catch(e){L.push('Permiso de cámara: n/d')}try{const d=await navigator.mediaDevices.enumerateDevices();L.push('Cámaras detectadas: '+d.filter(x=>x.kind=='videoinput').length)}catch(e){L.push('Dispositivos: error '+(e.name||''))}L.push('Navegador: '+navigator.userAgent.slice(0,90));const e=$('cdiag');if(e)e.innerHTML=L.map(esc).join('<br>')}
function flip(){facing=facing=='user'?'environment':'user';cam()}
function recStart(){return toggleRec();if(!stream)return alert('Activa la cámara');chunks=[];const mt=['video/webm;codecs=vp9,opus','video/webm','video/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));rec=new MediaRecorder(stream,mt?{mimeType:mt}:undefined);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||'video/webm'}));a.download='partido.webm';a.click()};rec.start();S.live=true;commit()}
function recStop(){if(RC)return stopRec();rec&&rec.state!='inactive'&&rec.stop();S.live=false;commit()}
function openOut(){window.open(location.href.split('#')[0]+'#out','flb_out','width=1280,height=720')}
function fullOut(){document.body.classList.toggle('out');if(document.body.classList.contains('out')){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});document.addEventListener('dblclick',()=>{document.body.classList.remove('out')},{once:true})}}
/* ---------- actions ---------- */
const clkStart=()=>{if(!S.clk.at)S.clk.at=Date.now();S.live=true;commit()};
const clkStop=()=>{if(S.clk.at){S.clk.base=T();S.clk.at=null}commit()};
function setPer(p){const run=!!S.clk.at;S.clk={base:{'2T':2700,ET1:5400,ET2:6300}[p]||0,at:run?Date.now():null,per:p,add:0};if(p=='2T'){S.bot=true;setTimeout(()=>{S.bot=false;commit()},9000)}commit()}
function adj(m){const r=!!S.clk.at;S.clk.base=Math.max(0,T()+m*60);if(r)S.clk.at=Date.now();commit()}
function show(o){S.ov=S.ov==o?null:o;commit()}
function goal(t,p,d){S.score[t]++;pushEv({k:'gol',t,p,d});}
function pushEv(e){e.m=min();S.ev.push(e);if(e.k=='gol')S.gl={t:e.t,p:e.p,d:e.d,m:e.m,ts:Date.now()};if(e.k=='amarilla')S[e.t?'away':'home'].cards[0]++;if(e.k=='roja')S[e.t?'away':'home'].cards[1]++;S.cur=e;S.ov='ev';commit();setTimeout(()=>{if(S.cur===e&&S.ov=='ev'){S.ov=null;commit()}},6000)}
function evForm(k){const t=+$('et').value,p=$('ep').value||'Jugador';const e={k,t,p,d:($('ed').value||'').trim()};if(k=='sub')e.x='Entra '+($('ei').value||'');k=='gol'?goal(t,p,e.d):pushEv(e)}
function img(file,w,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,w/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL(file.type=='image/jpeg'?'image/jpeg':'image/png',.85))};i.src=r.result};r.readAsDataURL(file)}
function up(inp,w,cb){inp.onchange=()=>inp.files[0]&&img(inp.files[0],w,u=>{cb(u);commit()})}
function pickFile(w,cb){const i=document.createElement('input');i.type='file';i.accept='image/*';up(i,w,cb);i.click()}
const set=(o,k,v)=>{o[k]=v;save('flb_cur',S);bc&&bc.postMessage(S);render()};
const inp=(lbl,o,k,t='text')=>{const id='i'+Math.random().toString(36).slice(2);setTimeout(()=>{const e=$(id);e&&(e.oninput=()=>set(o,k,e.value))});return `<div><label>${lbl}</label><input id="${id}" type="${t}" value="${esc(o[k])}" style="width:100%"></div>`};
/* ---------- UI ---------- */
const TABS=['Gráficos','Templates','Penales y textos','Eventos','Partido','Equipos','Estadísticas','Diseñador','Cámara','Mis partidos'];
function ui(){if(isOut)return;$('tabs').innerHTML=TABS.map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';ui()">${t}</button>`).join('');
const Q=[['Marcador','sb'],['Previa','pre'],['Alineación local','lineH'],['Alineación visit.','lineA'],['Medio tiempo','ht'],['2º tiempo','sh'],['Estadísticas','stats'],['Final','ft'],['Campeón','champ'],['Texto','txt'],['Match Day','md'],['Tabla','tbg'],['Ticker','tk'],['Penales Premier','penp'],['Penales TNT','pent'],['Marcador inferior','bot'],['Logos','bug']];
$('qa').innerHTML=Q.map(([n,k])=>{const tg=['sb','bot','bug'].includes(k),on=tg?S[k]:S.ov==k;return `<button class="${on?'a':''}" onclick="${tg?`S.${k}=!S.${k};commit()`:`show('${k}')`}">${n}</button>`}).join('')+S.cgs.map(d=>`<button class="${S.ov=='cg'&&S.cgv==d.id?'a':''}" onclick="if(S.ov=='cg'&&S.cgv=='${d.id}'){S.ov=null}else{S.cgv='${d.id}';S.ov='cg'}commit()">★ ${esc(d.name)}</button>`).join('')+`<button class="r" onclick="S.ov=null;commit()">Limpiar gráfico</button>`;
$('tab').innerHTML=({Gráficos:()=>'<div class="pan" style="color:var(--mu);font-size:12px">Toca un gráfico para mostrarlo u ocultarlo. Sus diseños se eligen en Templates.</div>',Eventos:cCtrl,'Penales y textos':()=>cExtra()+cNews()+cPen(),Control:cCtrl,Partido:cMatch,Equipos:cTeams,'Estadísticas':cStats,Templates:cTpl,'Cámara':cCam,'Mis partidos':cMy,Extras:()=>cExtra()+cNews()+cPen(),Diseñador:cDes})[tab]();after();$('qa').style.display=tab=='Gráficos'?'':'none'}
function after(){document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const [w,path]=b.dataset.up.split('|');const p=path.split('.');pickFile(+w,u=>{let o=p[0]=='S'?S:null;eval(path.replace(/^S/,'S')+'=u')})})}
function pOpts(t){return S[t?'away':'home'].pl.map(p=>p.n).filter(Boolean).map(n=>`<option>${esc(n)}</option>`).join('')}
function cCtrl(){return `<div class="pan"><h4>CRONÓMETRO ${S.clk.per}</h4><div class="g2"><button class="g" onclick="clkStart()">▶ Iniciar</button><button onclick="clkStop()">⏸ Pausar</button><button onclick="setPer('1T')">1T</button><button onclick="setPer('2T')">2T</button><button onclick="adj(-1)">−1 min</button><button onclick="adj(1)">+1 min</button><button onclick="S.clk.add=Math.max(0,S.clk.add-1);commit()">− añadido</button><button onclick="S.clk.add++;commit()">+ añadido</button></div></div>
<div class="pan"><h4>MARCADOR</h4><div class="row"><b>${esc(S.home.short)}</b><button onclick="S.score[0]=Math.max(0,S.score[0]-1);commit()">−</button><b style="text-align:center;font-size:22px">${S.score[0]}</b><button onclick="S.score[0]++;commit()">+</button></div><div class="row"><b>${esc(S.away.short)}</b><button onclick="S.score[1]=Math.max(0,S.score[1]-1);commit()">−</button><b style="text-align:center;font-size:22px">${S.score[1]}</b><button onclick="S.score[1]++;commit()">+</button></div></div>
<div class="pan"><h4>EVENTOS (se muestran solos 6 s)</h4><div class="row"><select id="et" onchange="document.getElementById('ep').innerHTML=pOpts(+this.value)"><option value="0">${esc(S.home.name)}</option><option value="1">${esc(S.away.name)}</option></select><select id="ep">${pOpts(0)}</select></div><div class="row"><input id="ed" placeholder="Dorsal (opcional)" inputmode="numeric"><input id="ei" placeholder="Entra (cambio)"></div><div class="g2"><button class="g" onclick="evForm('gol')">⚽ Gol</button><button style="background:#a88800" onclick="evForm('amarilla')">🟨 Amarilla</button><button class="r" onclick="evForm('roja')">🟥 Roja</button><button onclick="evForm('sub')">⇄ Cambio</button></div><div style="margin-top:6px;color:var(--mu);font-size:12px">${S.ev.map(e=>`${e.m}' ${e.k} ${esc(e.p)}`).join(' · ')}</div></div>`}
function cMatch(){return `<div class="pan"><h4>COMPETICIÓN</h4><div class="row">${inp('Nombre',S.comp,'name')}${inp('Jornada / fase',S.comp,'round')}</div><div class="row">${inp('Fecha',S.comp,'date')}${inp('Árbitro',S.comp,'ref')}</div><div class="row">${inp('Estadio',S,'venue')}<button data-up="300|S.comp.logo">${S.comp.logo?'✓ ':''}Subir logo competición</button></div><div class="row"><button data-up="300|S.brand">${S.brand?'✓ ':''}Subir logo de quien transmite</button><button onclick="S.bug=!S.bug;commit()">Logos en pantalla: ${S.bug?'ON':'OFF'}</button></div></div>${bugUI()}`}
function cTeams(){const t=S[side],k=side;return `<div class="tabs"><button class="${k=='home'?'on':''}" onclick="side='home';ui()">Local</button><button class="${k=='away'?'on':''}" onclick="side='away';ui()">Visitante</button></div><div class="pan"><div class="row">${inp('Nombre completo',t,'name')}${inp('Abreviado (marcador)',t,'short')}</div><div class="row"><div><label>Color</label><input type="color" value="${t.color}" oninput="set(S['${k}'],'color',this.value)"></div><button data-up="300|S.${k}.crest">${t.crest?'✓ ':''}Escudo</button>${inp('Entrenador',t,'coach')}<button data-up="500|S.${k}.coachPic">Foto DT</button></div>
<div class="row"><div><label>Jugadores en cancha</label><select onchange="S['${k}'].n=+this.value;S['${k}'].form=FD[+this.value];S['${k}'].pl.forEach(p=>{delete p.px;delete p.py});commit()">${[11,10,9,8].map(v=>`<option ${v==(t.n||11)?'selected':''}>${v}</option>`).join('')}</select></div><div><label>Formación</label><select onchange="set(S['${k}'],'form',this.value);">${FS[t.n||11].map(f=>`<option ${f==t.form?'selected':''}>${f}</option>`).join('')}</select></div>${inp('Personalizada (ej 3-2-4-1)',t,'form')}</div>
<div class="row"><button onclick="document.body.classList.toggle('edit');S.ov='${k=='home'?'lineH':'lineA'}';commit()">✋ Mover jugadores (arrastra en la vista previa)</button><button onclick="S['${k}'].pl.forEach(p=>{delete p.px;delete p.py});commit()">↺ Restablecer</button></div><h4>TITULARES (1º = arquero)</h4>${t.pl.slice(0,t.n||11).map((p,i)=>`<div class="row"><input style="flex:0 0 58px;min-width:0" placeholder="Nº" value="${esc(p.d||'')}" oninput="S['${k}'].pl[${i}].d=this.value;save('flb_cur',S);bc&&bc.postMessage(S);render()"><input style="flex:3" value="${esc(p.n)}" placeholder="Nombre Apellido" oninput="S['${k}'].pl[${i}].n=this.value;save('flb_cur',S);bc&&bc.postMessage(S);render()"><button data-up="300|S.${k}.pl[${i}].pic" style="flex:1">${p.pic?'<img class=thumb src="'+p.pic+'">':'📷'}</button></div>`).join('')}
<label>Suplentes (uno por línea)</label><textarea oninput="S['${k}'].subs=this.value;save('flb_cur',S);bc&&bc.postMessage(S);render()">${esc(t.subs)}</textarea>
<div class="row"><button onclick="TEAMS.push(JSON.parse(JSON.stringify(S['${k}'])));save('flb_teams',TEAMS);ui()">💾 Guardar equipo</button></div></div>
<div class="pan"><h4>EQUIPOS GUARDADOS</h4>${TEAMS.map((x,i)=>`<div class="row"><span>${esc(x.name)}</span><button onclick="S['${k}']=JSON.parse(JSON.stringify(TEAMS[${i}]));commit()">Cargar</button><button class="r" onclick="TEAMS.splice(${i},1);save('flb_teams',TEAMS);ui()">✕</button></div>`).join('')||'<span style="color:var(--mu)">Ninguno</span>'}</div>`}
function cStats(){const L={pos:'Posesión %',sh:'Tiros',sot:'Tiros al arco',cor:'Córners',fou:'Faltas',pas:'Pases',off:'Fuera de juego'};return `<div class="pan">${Object.keys(L).map(k=>`<div class="row"><b style="flex:0 0 110px">${L[k]}</b><input type="number" value="${S.st[k][0]}" oninput="S.st.${k}[0]=this.value;set(S,'st',S.st)"><input type="number" value="${S.st[k][1]}" oninput="S.st.${k}[1]=this.value;set(S,'st',S.st)"></div>`).join('')}<div class="row"><button class="a" onclick="show('stats')">Mostrar estadísticas</button></div></div>`}
function cTpl(){const N={sb:'Marcadores',pre:'Previa / Medio tiempo / Final / Stats',line:'Alineaciones'};return animUI()+cfgUI()+cfgUI2()+creator()+Object.keys(N).map(c=>`<div class="pan"><h4>${N[c].toUpperCase()}</h4><div class="tp">${TL(c).map(t=>`<div class="${S.tpl[c]==t.id?'on':''}" onclick="S.tpl.${c}='${t.id}';commit()">${t.p?`<div style="height:46px;background:linear-gradient(90deg,#0a4fcc,${t.p.c} 50%,#d40000);border-bottom:3px solid ${t.p.a}"></div>`:`<img src="${t.up||(t.bg?IMG[t.bg]:'')}">`}${esc(t.name)}</div>`).join('')}</div><div class="row"><button onclick="pickFile(1600,u=>S.custom.push({cat:'${c}',id:'c'+Date.now(),name:'Mi fondo',up:u}))">＋ Subir fondo (usa esta distribución)</button><button onclick="S.custom=S.custom.filter(x=>x.id!=S.tpl.${c});S.tpl.${c}=BASE.${c}[0].id;commit()">Eliminar propio</button></div></div>`).join('')+'<div class="pan" style="color:var(--mu);font-size:12px">Para añadir un diseño nuevo con distribución propia, envíame la imagen y lo agrego como plantilla.</div>'}
function cCam(){return `<div class="pan"><h4>CÁMARA</h4><div id="cerr" style="color:#ff8a8a;margin-bottom:6px"></div>${window.self!==window.top?`<div class="row"><button class="a" onclick="window.open(location.href.split('#')[0],'_blank')">↗ Abrir en pestaña completa (aquí la cámara suele estar bloqueada)</button></div>`:''}<div class="row"><select id="res"><option>1280x720</option><option>1920x1080</option><option>854x480</option></select><button class="a" onclick="cam()">Activar</button><button onclick="flip()">🔄 Frontal/Trasera</button></div><div class="row"><button class="r" onclick="recStart()">⏺ Grabar</button><button onclick="recStop()">⏹ Detener y guardar</button></div><div class="row"><button onclick="diag()">🔎 Diagnóstico de cámara</button><button onclick="srcFile(0)">🎞 Usar un video de la galería</button></div><div class="row"><button onclick="srcFile(1)">📹 Grabar clip con la cámara del celular</button><button onclick="scr()">🖥 Compartir pantalla</button></div><div id="cdiag" style="font-size:12px;color:var(--mu);margin:6px 0"></div><div class="row"><button onclick="openOut()">📺 Salida limpia (ventana)</button><button onclick="fullOut()">⛶ Pantalla limpia (doble toque para salir)</button></div><div class="pan"><h4>GRABACIONES GUARDADAS</h4><button onclick="recList()">Ver grabaciones</button><div id="rlist" style="margin-top:6px"></div></div><p style="color:var(--mu);font-size:12px">Para transmitir a YouTube: abre “Salida limpia” y captúrala con OBS/Streamlabs (captura de ventana) o usa la pantalla compartida. Desde el navegador no se puede enviar RTMP directo; la grabación guarda solo el video de la cámara.</p></div>`}
function cMy(){return `<div class="pan"><div class="row"><button class="a" onclick="MATCHES.push({n:S.home.name+' vs '+S.away.name+' · '+S.comp.name,d:JSON.parse(JSON.stringify(S))});save('flb_m',MATCHES);ui()">💾 Guardar partido actual</button><button onclick="S=D();commit()">＋ Nuevo</button></div>${MATCHES.map((m,i)=>`<div class="row"><span style="flex:3">${esc(m.n)}</span><button onclick="S=JSON.parse(JSON.stringify(MATCHES[${i}].d));commit()">Abrir</button><button onclick="MATCHES.push(JSON.parse(JSON.stringify(MATCHES[${i}])));save('flb_m',MATCHES);ui()">⧉</button><button class="r" onclick="MATCHES.splice(${i},1);save('flb_m',MATCHES);ui()">✕</button></div>`).join('')}<p style="color:var(--mu);font-size:12px">El partido en curso se guarda solo automáticamente.</p></div>`}
if(isOut){cam()}render();ui();
</script></body></html>
